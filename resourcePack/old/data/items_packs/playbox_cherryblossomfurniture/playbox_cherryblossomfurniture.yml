info:
    namespace: playbox_cherryblossomfurniture
items:
    cherryblossomfurniture_basket:
        display_name: "Cherry Blossom Basket"
        permission: playbox_cherryblossomfurniture.basket
        resource:
            material: PAPER
            generate: false
            model_path: basket
        behaviours:
            furniture:
                solid: true
                fixed_rotation: false
                opposite_direction: true
                entity: armor_stand
                hitbox:
                    length: 1
                    width: 1
                    height: 1
                    length_offset: 0
                    width_offset: 0
                    height_offset: 0
                placeable_on:
                    floor: true
                    ceiling: false
                    walls: false
