items:
  knight_statue:
    display_name: "knight_statue"
    permission: mctown.statue.knight_statue
    resource:
      material: item_frame
      generate: false
      model_path: block/item/statue/knight_statue
    behaviours:
      furniture:
        solid: true
        small: true
        placeable_on:
          floor: true
          ceiling: false
          walls: false
        hitbox:
          height: 3
          length: 1
          width: 1
        sound:
          place:
            name: block.metal.fall
          break:
            name: block.metal.break
