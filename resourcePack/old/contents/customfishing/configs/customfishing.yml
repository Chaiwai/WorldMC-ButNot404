##################################################################
# Note: This file is made for you to manager textures and models #
# If you want to get ItemsAdder items in CustomFishing, you      #
# should manually set "material: ItemsAdder:namespace:id " in    #
# CustomFishing items' configuration.                            #
# If you want ItemsAdder to have CustomFishing items' effects    #
# You should add "nbt: {CustomFishing: {type: TYPE, id: ID}}"    #
# (for items) or "{Totem: totem_id}" (for totems) in             #
# ItemsAdder item configuration.                                 #
##################################################################
