basic:
  id: bantering
  name: 戏谑
  enable: true
  max-level: 6
display:
  description:
    general: 使得周围生物的伤害吸收总量减少(冷却时间内对于同个生物仅会生效一次)，盔甲会自动扣除耐久
alternative:
  grindstoneable: true
  is-tradeable: true
  is-treasure: false
  is-discoverable: true
rarity: 史诗
targets:
- helmets
- chestplates
- leggings
- boots
# 暂不支持 limits 内这四项配置
limits:
  withLore: []
  withoutLore: []
  withName: ''
  withoutName: ''
limitations: []
variables:
  leveled:
    range: :3+{level}*0.5
    absorption-multiplier: :1-0.1*{level}
    cooldown: :10-{level}
