# 默认的物品类型。这些不能被移除。它们
# 可以被用作'父类'来创建新的物品类型
# 这将会像另一个物品类型一样表现。父类
# 在/language/item_type.yml生成他们自己的配置文件
# 每种物品类型都有其未识别物品的模板。
# 如果你不指定一个像默认的SWORD物品类型，
# 它将使用默认的（未翻译的）英文模板。
# 当使用/mmoitems命令时作为参考
SWORD:
    # display参数用于在物品浏览器和配方列表中显示物品
    # 当你移动工作台时。你可以使用耐久度来自定义纹理。
    # 在1.14中，耐久度被CustomModelData替代。
    display: IRON_SWORD:0
    # 在物品描述中显示的名称。
    name: "剑"
    # 未识别物品的模板。
    unident-item:
        name: "&f#prefix#未识别的剑"
        lore:
            - "&7这个物品未被识别。我必须"
            - "&7找到一种方法来识别它！"
            - "{tier}"
            - "{tier}&8物品信息："
            - "{range}&8- &7等级范围：&e#range#"
            - "{tier}&8- &7物品等级：#prefix##tier#"
    # 物品类型的作用
    on-attack: slashing_attack_effect
