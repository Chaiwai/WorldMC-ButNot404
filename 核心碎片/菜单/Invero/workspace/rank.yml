title: "副本传送"
rows: 6
activators:
  command:
    name: "rank"
    permission: "menu.rank"

########################################
page_O: &page_O
  material: paper
  customModelData: 10340
  name: "&a&l上一页"
  # menu title to {{page get}}
  action: |-
    page previous
page_N: &page_N
  material: paper
  customModelData: 10341
  name: "&a&l下一页"
  action: |-
    page next

up: &up
  name: "&a&l当前冒险等级:%math_0_{PlayerCurrency_level}+1%"
  lore: |-
    &r    &f&l经验值: %PlayerCurrency_level_xp%&7/&f%math_0_128*(({PlayerCurrency_level}+1)^1.1)%
    &r    &f&l暂时的经验还无法升级哦~
  action: sound entity_item_break by 1 2
  sub:
    - rule: check papi "%math_0_{PlayerCurrency_level_xp}-128*(({PlayerCurrency_level}+1)^1.1)%" >= "0"
      name: "&6&l喜报,你可以升级了!"
      lore: |-
        &r    &f&l经验值: &6%PlayerCurrency_level_xp%&7/&f%math_0_128*(({PlayerCurrency_level}+1)^1.1)%
        &r    &6&l点我升级!
      ia: arrow_up2
      action: |-
        menu close
        command "ply take %player_name% level_xp %math_0_128*(({PlayerCurrency_level}+1)^1.1)%" as console
        command "ply give %player_name% level 1" as console
        msg ":fuhao3:升级成功!"
        sleep 0.1s
        menu open rank
        msg ":fuhao4:成就系统正在制作中,后续可以领取奖励"
        sound entity_player_levelup by 1 2

rankup: &rankup
  name: "&a&l你已经解锁目前的所有rank等级,感谢你的陪伴!"
  lore: |-
    &r    &f&l持续更新中...
  sub:
    - rule: perm "group.r9"
      name: "&a&l你已经解锁目前的所有rank等级,感谢你的陪伴!"
      lore: |-
        &r    &f&l持续更新中...
      action: |-
        menu close
