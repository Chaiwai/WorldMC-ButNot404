      name: "&r&c升级⑨你的进度太快了, 这里还在制作中请勿使用!!!!!以防吞物品"
      lore: |-
        &r    &f&lxxx
      action: |-
        menu close
    - rule: perm "group.r7"
      name: "&r&c升级⑧你的进度太快了, 这里还在制作中请勿使用!!!!!以防吞物品"
      lore: |-
