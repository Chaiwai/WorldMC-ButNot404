        all:
          - check papi "%mcmmo_powerlevel%" >= "4000"

          - inventory check "minecraft:paper[name=古老的金币,model=10445]" amount 50

          - check papi "%playerpoints_points%" >= "500"
          - check papi "%vault_eco_balance%" >= "5000"
          - inventory check "minecraft:blue_dye[model=10001]" amount 1
          - inventory check "minecraft:green_dye[model=20003]" amount 1

        then:
          - any:
              - inventory check "minecraft:diamond_sword[model=10056]" amount 1
              - inventory check "minecraft:diamond_sword[model=10053]" amount 1
              - inventory check "minecraft:diamond_sword[model=10066]" amount 1
              - inventory check "minecraft:diamond_sword[model=10057]" amount 1
              - inventory check "minecraft:diamond_sword[model=10071]" amount 1
            then: |-
              inventory take "minecraft:paper[name=古老的金币,model=10445]" amount 50
              inventory take "minecraft:blue_dye[model=10001]" amount 1

              command "money take %player_name% 5000" as console
              command "points take %player_name% 500" as console

              command "lp user %player_name% parent add r6" as console
              command "trchat tellsimple * &a恭喜玩家&b%player_name%&a升级为&f⑥&a!" as console

              sound ui_toast_challenge_complete by 1 1
              msg ":fuhao1: &c你不满足条件！"
            else: |-
              menu close
              msg ":fuhao1: &c你不满足条件！"
        else: |-
          menu close
          msg ":fuhao1: &c你不满足条件！"
