      lore: |-
        &r    &a&l当前等级 &e:&f ⑤
        &r    &b&l下一等级 &e:&f ⑥
        &r    &b&l领地价格&c4&a→&b4
        &r    &7&l=======================
        &r    &b&l解锁特权 &e:
        &r    &b&l每日礼包
        &r    &b&lmcmmo经验倍率*1.6
        &r    &b&lhome数量&c10&a→&b11
        &r    &b&l领地数量&c5&a→&b6
        &r    &b&l领地价格&c4&a→&b3
        &r    &7&l=======================
        &r    &d&l升级条件 &e:
        &r    &amcmmo战力&e>=&a4000&7[当前:&c%mcmmo_powerlevel%&7]
        &r    &a锻造任意一把&d元素刀&b[&eIII 阶&b] &7详情配方见菜单第二页合成
        &r    &a制作出&e"&a无&b尽&c锭&e"&a * 1&7(放在背包中即可, 不消耗)
        &r    &a&7tips如果你忘记了无尽贪婪的意义, 可以寻找维华来帮助你完成这个任务
        &r    &7&l=======================
        &r    &d提交道具 &e:
        &r    &d&f无尽催化剂&d * 1
        &r    &7&l=======================
        &r    &a点击消耗货币升级rank等级
        &r    &f5000&f %img_mnoney%
        &r    &f500 &f %img_points_icon%
        &r    &f古老的金币 &e* &a 50
        &r    &7&l=======================
