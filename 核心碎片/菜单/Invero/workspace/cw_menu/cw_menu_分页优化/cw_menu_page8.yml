title: ":offset_-9::cw_menu2:"
rows: 6

activators:
  command:
    name: "cd_test3"
    permission: "menu.cd"

events:
  pre_open: sound entity_item_pickup by 1 0
  close: sound entity_item_pickup by 1 1

zk1: &zk1
  ia: cw_made_items_cw_made_items_item8
  name: " &l&b水晶周卡 &7* &b7天"
  lore: |-
    &r
    &r  &6消耗: &f水晶 &7* &f1000
    &r  &b获得: 水晶&7 * &f200&7 * &f7 &7共计1400
    &r  &f▸   &f%img_left_click% &l点击购买   &f◂
    &r  &7当前剩余时长%luckperms_group_expiry_time_zk1%
    &r
  action:
    all:
      - check papi "%playerpoints_points%" >= "1000"
    then: |-
      command "points take %player_name% 1000" as console
      command "lp user %player_name% parent addtemp zk1 1w accumulate" as console
      msg ":fuhao3: &a激活成功！"
      menu close
    else: |-
      msg ":fuhao1: &c水晶不足！"
zk2: &zk2
  ia: cw_made_items_cw_made_items_item10
  name: " &l&b水晶周卡&6付费版 &7* &b7天"
  lore: |-
    &r
    &r  &6消耗: &x&f&b&3&f&e&1&l无&x&c&6&3&8&e&a&l暇&x&9&2&3&2&f&4&l水&x&5&d&2&b&f&d&l晶 &7* &f6
    &r  &b获得: 水晶*300*7 共计2100
    &r  &f▸   &f%img_left_click% &l点击获取   &f◂
    &r  &7当前剩余时长%luckperms_group_expiry_time_zk2%
    &r
  action:
    all:
      - check papi "%playercurrency_point_pro%" >= "6"
    then: |-
      command "ply give %player_name% point_pro -6 购买付费周卡" as console
      command "lp user %player_name% parent addtemp zk2 1w accumulate" as console
      msg ":fuhao3: &a激活成功！"
      menu close
    else: |-
      msg ":fuhao1: &c水晶不足！"
