title: ":offset_-9::cw_x:"
rows: 6

activators:
  command:
    name: "cd_test3"
    permission: "menu.cd"

events:
  pre_open: sound entity_item_pickup by 1 0
  close: sound entity_item_pickup by 1 1

rank_up: &rank_up
  ia: sou1
  name: "&x&0&0&D&6&F&FRANK等级提升"
  action: menu open rank
  lore: |-
    &f
    &f&c提升rank解锁更多特权&c菜单正在努力优化中..
    &f
    &f%img_left_click% &7点击打开
    &f
level_up: &level_up
  ia: soul2
  name: "&x&F&F&F&1&1&7冒险等级提升&7:%math_0_{PlayerCurrency_level}+1%"
  lore: |-
    &r
    &r&f&l经验值: %PlayerCurrency_level_xp%&7/&f%math_0_128*(({PlayerCurrency_level}+1)^1.1)%
    &r&f&l暂时的经验还无法升级哦~
    &r
  action: sound entity_item_break by 1 2
  sub:
    - rule: check papi "%math_0_{PlayerCurrency_level_xp}-128*(({PlayerCurrency_level}+1)^1.1)%" >= "0"
      name: "&6&l喜报,你可以升级了!"
      lore: |-
        &r  
        &r    &f&l经验值: &6%PlayerCurrency_level_xp%&7/&f%math_0_128*(({PlayerCurrency_level}+1)^1.1)%
        &r    &6&l点我升级!
        &r
      action: |-
        menu close
        command "ply take %player_name% level_xp %math_0_128*(({PlayerCurrency_level}+1)^1.1)%" as console
        command "ply give %player_name% level 1" as console
        msg ":fuhao3:升级成功!"
        sleep 0.1s
        menu open rank
        msg ":fuhao4:成就系统正在制作中,后续可以领取奖励"
        sound entity_player_levelup by 1 2
mcmmo: &mcmmo
  ia: soul3
  name: "&x&#&0&8&4&C&F&BmcMMO技能"
