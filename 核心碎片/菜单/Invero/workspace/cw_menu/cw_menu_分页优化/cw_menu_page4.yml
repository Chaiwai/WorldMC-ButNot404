  lore: |-
    &f
    &f&7一款老牌技能插件
    &f
    &f%img_left_click% &7点击查看
    &f
att: &att
  ia: soul4
  lore: |-
    &f
    &f&7一款老牌属性插件
    &f
    &f%img_left_click% &7点击查看
    &f
  name: "测试中"
  action: command "attributeplus stats"
