  lore: |-
    &f
    &f&7挑选一个炫酷的称号?
    &f
    &f%img_left_click% &7点击打开
    &f
shop6: &shop6
  ia: large_amethyst
  name: "§x§0§2§A§9§F§F水晶商店"
  action:
  lore: |-
    &f
    &f&7可以用水晶购买一些道具&c(制作中)
    &f
    &f%img_left_click% &7点击打开
    &f
shop7: &shop7
  ia: dungeon_spirit
  name: "§x§0§2§A§9§F§F周卡商店"
  action: |-
    menu open cw_menu_page8
    menu title to ":offset_-9::cw_menu2:"
    sound entity_item_pickup by 1 0
  lore: |-
    &f
    &f&7你可以获取海量水晶
    &f
    &f%img_left_click% &7点击打开
    &f
shop8: &shop8
  ia: gem5
  name: "§x§F§F§5§7§E§7特权商店"
  action: menu open cw_vipshop
  lore: |-
    &f
    &f&7进阶你的头衔!
    &f
    &f%img_left_click% &7点击打开
    &f
shop9: &shop9
  ia: off_hand_5_2
  name: "§x§F§F§0§0§0§0赞助商店"
  action: |-
    sound entity_arrow_hit_player by 1 1
    menu open cw_xpay
  lore: |-
    &f
    &f&7=============================
    &f&7服务器为爱发电, 不氪金完全可玩
    &f&7=============================
    &f&7但是如果你愿意赞助我, 非常欢迎!
    &f&7你的每一份付出都会真投入到服务器中
    &f&7=============================
    &f&7我是不求人👍
    &f
    &f%img_left_click% &7点击打开
    &f
