    name: "§x§F§B§E§C§0§5个人设置"
    lore: |-
      &f
      &f&7一些有点好用的设置
      &f
      &f%img_left_click% &7点击打开
      &f
    action: |-
      menu open cw_menu_page1
  "L2":
