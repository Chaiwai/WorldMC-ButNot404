    &f
  action: |-
    menu open cw_menu_page0
#空
nu: &nu
  ia: cw_ui_1
  name: "§x§F§F§0§0§0§0敬§x§F§F§0§0§0§0请§x§F§F§0§0§0§0期§x§F§F§0§0§0§0待"
