  close: sound entity_item_pickup by 1 1

shop1: &shop1
  material: wheat
  name: "§x§f§f§7§c§0§d总作物回收"
  action: command "shoppro open 农作物" as op
  lore: |-
    &f
    &f&7冰冷的农作物回收为温暖的金币
    &f
    &f%img_left_click% &7点击打开
    &f
shop2: &shop2
  material: bricks
  name: "§x§f§f§7§c§0§d建材商店"
  action: command "shoppro open 建筑方块" as op
  lore: |-
    &f
    &f&7海量廉价方块, 可联系服主添加更多
    &f
    &f%img_left_click% &7点击打开
    &f
shop3: &shop3
