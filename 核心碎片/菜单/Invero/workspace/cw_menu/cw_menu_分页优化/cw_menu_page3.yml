    <<: *shop8
    # <<: *shop5
  "6":
    # <<: *shop6
    <<: *nu
  "7":
    # <<: *shop7
    <<: *nu
  "8":
    # <<: *shop8
    <<: *nu
  "9":
    # <<: *shop9
    <<: *nu
  "L1":
