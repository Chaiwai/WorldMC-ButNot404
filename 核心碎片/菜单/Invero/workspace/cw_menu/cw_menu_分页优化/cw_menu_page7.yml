title: ":offset_-9::cw_menu2:"
rows: 6

activators:
  command:
    name: "cd_test3"
    permission: "menu.cd"

events:
  pre_open: sound entity_item_pickup by 1 0
  close: sound entity_item_pickup by 1 1
pet1: &pet1
  ia: clear
  name: "&c丢弃你的宠物?"
  lore: |-
    &7他可是你的家人啊?你会失去他!真的很久
    &f%img_left_click% &7点击丢弃
  action:
    all: #权限判定
      - check papi "%mypet_has_pet%" == "yes"
    then: |- #满足执行
      menu close
      command "petrelease" as player
    else: |- #不满足执行
      menu close
      msg "&c你当前没有宠物!"
