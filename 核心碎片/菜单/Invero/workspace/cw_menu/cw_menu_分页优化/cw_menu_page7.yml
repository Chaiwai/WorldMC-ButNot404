pet9: &pet9
  material: writable_book
  name: "&b宠物名字更改"
  lore: |-
    点击修改宠物名字
  action:
    catch: pet_name
    cancel: ["cancel"]
    beforeInput: |
      tell "&a请在聊天栏输入你宠物的新名字"
      tell "&7输入 &f'cancel' &7来取消操作"
    afterInput:
      if: all [
        check papi "%mypet_has_pet%" == "yes"
        ]
      then: |-
        command "petname {{&pet_name}}" as player
        sleep 0.1s
        menu close
      else: |-
        msg "&c你当前没有宠物!"
        sleep 0.1s
        menu close
    onCancel: |
      msg "&c你已取消当前操作"
    onRepeat: |
      tell "?"
