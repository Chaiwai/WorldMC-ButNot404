panels:
  - scale: [9, 6]
    pages:
      # 常规
      - layout: |-
          ########C
          Hh#12345#
          hh#6789a#
          ###bcdef#
          ########T
          O###X###N
        items:
          "T":
            material: AIR
            sub:
              if: perm "aaa"
              material: arrow
              name: "op功能"
              action: |-
                context set 'player@day' to 0
                tell "重置完成"
                menu close
          "H":
            <<: *head
          "h":
            <<: *h
          "O":
            <<: *nu
          "N":
            <<: *nu
          "X":
            <<: *nu
          "C":
            <<: *p0
          "1":
            material: barrier
            action:
              left: tell '%playercurrency_shop1%'
                tell 'left'
              drop:
                - if: all [ '{{context get player@tq_shop1_sx}}' >= 0 ]
                  then: tell '成功'
                  else: tell '次数不足'
                - case: "%math_0_{{context get player@tq_shop1_sx}}%"
                  when:
                    "= 0": "tell '=0%math_{{context get player@tq_shop1_sx}}%'"
                    "= 1": "tell '=1%math_{{context get player@tq_shop1_sx}}%'"
                    "= 2": "tell '=2%math_{{context get player@tq_shop1_sx}}%'"
                    "= 3": "tell '=3%math_{{context get player@tq_shop1_sx}}%'"
                  else: |-
                    context dec player@tq_shop1_sx by 1
                    command "ply set %player_name% shop1 %math_3_floor(random()*{{context get max_shop1}})% 每日刷新" as console
                    sleep 0.1s
                    menu open cw_特权商店

            lore: |-
              &r
              &r<gradient:#FFC9C9:#DECCFF>每日特惠(每日0:00刷新)</gradient>
              &r<gradient:#A6A6A6:#454545:#A6A6A6>===============</gradient>
              &r<#CCCCCC>物品售价 &7: &6150 &f%img_mnoney%
              &r<#CCCCCC>购买次数 &7: <#ccfec9>{{context get player@tq_shop1}}
              &r<#CD9EFF>刷新次数 &7: <#ccfec9>{{context get player@tq_shop1_sx}}
              &r<gradient:#A6A6A6:#454545:#A6A6A6>===============</gradient>
              &r&7 按下 &f%img_left_click% <#ffffff>&7 购买 &61 &f个
              &r&7 按下 <#75FF91>q键 &7刷新当前商品
              &r<gradient:#A6A6A6:#454545:#A6A6A6>===============</gradient>
              &r
            sub:
              - if: check papi "%playercurrency_shop1%" <= 14.29
                <<: *w0
              - if: check papi "%playercurrency_shop1%" <= 28.58
                <<: *w1
              - if: check papi "%playercurrency_shop1%" <= 42.87
                <<: *w2
              - if: check papi "%playercurrency_shop1%" <= 50.01
                <<: *w3
              - if: check papi "%playercurrency_shop1%" <= 57.15
                <<: *w4
              - if: check papi "%playercurrency_shop1%" <= 64.29
                <<: *w5
              - if: check papi "%playercurrency_shop1%" <= 68.58
                <<: *w6
              - if: check papi "%playercurrency_shop1%" <= 72.87
                <<: *w7
              - if: check papi "%playercurrency_shop1%" <= 77.16
                <<: *w8
              - if: check papi "%playercurrency_shop1%" <= 78.59
                <<: *w9
              - if: check papi "%playercurrency_shop1%" <= 80.02
                <<: *w10
              - if: check papi "%playercurrency_shop1%" <= 81.45
                <<: *w11
              - if: check papi "%playercurrency_shop1%" <= 82.88
                <<: *w12
              - if: check papi "%playercurrency_shop1%" <= 84.31
                <<: *w13
              - if: check papi "%playercurrency_shop1%" <= 85.74
                <<: *w14
              - if: check papi "%playercurrency_shop1%" <= 86.45
                <<: *w15
              - if: check papi "%playercurrency_shop1%" <= 87.16
