title: ":offset_-9::cw_ui3:"

events:
  pre_open:
    - context set max_shop1 to 88
    - if: check context get 'player@day' != papi "%server_time_D%"
      then: |-
        context set 'player@day' to papi "%server_time_D%"
        command "ply set %player_name% shop1 %math_3_floor(random()*{{context get max_shop1}})% 每日刷新" as console
        context set 'player@tq_shop1' to 5
        context set 'player@tq_shop1_sx' to 3
        tell '新的一天{{context get player@day}}'
        tell '新的一天{{context get player@tq_shop1}}'
        tell '商品1: %playercurrency_shop1%'
        sound entity_item_pickup by 1 1
        sleep 0.1s
        menu open cw_特权商店
      else: |-
        sound entity_item_pickup by 1 1
        tell 旧的一天
  close: sound entity_item_pickup by 1 2
########################################
p0: &p0
  ia: cancel
  name: "<gradient:#D1FB14:#FD9505>返回主页面</gradient>"
  lore: |-
    &f
    &f&7返回上一级目录
    &f
    &f%img_left_click% &7点击返回
    &f
  action: |-
    menu open cw_menu
pt0: &pt0
  ia: cancel
  name: "&7返回"
  lore: |-
    &r 
    &f %img_left_click% &7点击返回上一级目录
    &r
  action: |-
    page set to 0
    menu title to ":offset_-9::cw_ui3:"
    sound entity_item_pickup by 1 1
