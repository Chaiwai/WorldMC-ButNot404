      - 1::神奇的
      - 1::凯旋的
      - 1::刚毅的
      - 1::不灭的
      - 1::贪婪的
      - 2::心灵的
      - 2::结界的
      - 2::尖牙的
      - 2::创伤的
      - 2::涌现的
      - 2::寒冷的
      - 2::炫目的
    # 选取4条
    amount: 4
    # 是否打乱顺序
    shuffled: true
  # 用于处理不同前缀物品的不同信息
  前缀信息:
    强壮的:
      属性: "§7力量"
      数值:
        type: gaussian
