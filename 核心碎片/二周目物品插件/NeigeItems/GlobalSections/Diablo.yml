      - "§8<Diablo.后缀信息.<Diablo.后缀.0>.属性>： §7<Diablo.后缀信息.<Diablo.后缀.0>.数值>"
      - "§8<Diablo.后缀信息.<Diablo.后缀.1>.属性>： §7<Diablo.后缀信息.<Diablo.后缀.1>.数值>"
      - "§8<Diablo.后缀信息.<Diablo.后缀.2>.属性>： §7<Diablo.后缀信息.<Diablo.后缀.2>.数值>"
      - "§8<Diablo.后缀信息.<Diablo.后缀.3>.属性>： §7<Diablo.后缀信息.<Diablo.后缀.3>.数值>"
