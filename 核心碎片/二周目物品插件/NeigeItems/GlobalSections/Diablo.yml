          fixed: 0
          min: 1
        文本: "§8生命上限： §7<Diablo.类型信息.<Diablo.类型>.基本属性.数值>"
      宝石槽:
        文本: "§a[绿宝石槽]"
        数量: <number::1_3>
  # 用于生成装备前缀
