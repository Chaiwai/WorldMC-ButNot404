cw_tool_tem:
  name: "&r&f<物品名称>"
  material: <物品材质>
  components:
    minecraft:item_model: minecraft:netherite_pickaxe
    minecraft:max_damage: (Int) <fastcalc::<基础属性.耐久>+<基础属性.耐久>*+0.01*<cw_s.锻造属性.<cw_s.锻造品质>.耐久.数值>>
    minecraft:custom_model_data:
      floats:
        - (Float) <物品贴图>
    minecraft:attribute_modifiers:
      show_in_tooltip: (Byte) 0
      modifiers:
        - amount: (Double) <fastcalc::<cw_s.锻造属性.<cw_s.锻造品质>.攻速.数值>/100_2> #挖掘速度 /100 %
          id: minecraft:ab23552c-eb89-4012-9c6e-70f8ca30eed8
          type: minecraft:block_break_speed
          operation: add_multiplied_base
        - amount: (Double) <fastcalc::<基础属性.大小>-3_2>
          id: minecraft:7817a1c9-3d7e-4875-99fa-7e1bd6b897f4
          type: minecraft:block_interaction_range
          operation: add_value
        - amount: (Double) <fastcalc::<cw_s.锻造属性.<cw_s.锻造品质>.大小.数值>/100_2>
          id: minecraft:7817a1c9-3d7e-4875-99fa-7e1bd6b897f6
          type: minecraft:block_interaction_range
          operation: add_multiplied_base
      minecraft:repair_cost: (Int) 1

  options:
    update:
      enable: true
      refresh:
        - material
        - lore
      protect-components:
        - minecraft:custom_name
        - minecraft:enchantments
        - minecraft:damage

  globalsections:
    - cw_s.yml
    - cw_common.yml
  lore:
    - "&r&f   "
    - "&r&f"
    - "&r&f  <物品简介>"
    - "&r&f   "
    - "&r&f"
    - "&r&f  镐力: <基础属性.镐力>" #木镐60 加一级+10
    - "&r&f  速度: <cw_s.锻造属性.<cw_s.锻造品质>.攻速.前缀><cw_s.锻造属性.<cw_s.锻造品质>.攻速.数值>%"
    - "&r&f  大小: &f<基础属性.大小>&7(&7<cw_s.锻造属性.<cw_s.锻造品质>.大小.前缀><fastcalc::<基础属性.大小>*+0.01*<cw_s.锻造属性.<cw_s.锻造品质>.大小.数值>_2>&7)"
    - "&r&f  耐久: &f<基础属性.耐久>&7(&7<cw_s.锻造属性.<cw_s.锻造品质>.耐久.前缀><fastcalc::<基础属性.耐久>*+0.01*<cw_s.锻造属性.<cw_s.锻造品质>.耐久.数值>>&7)"
    - "&r&f   "
    - "&r&f"
    - "&r&f  锻造品质: <cw_s.锻造品质>"
    - "&r&f"
    - "&r&f  灵魂绑定: <cw_common.绑定.绑定名称>"
  nbt:
    itemsadder:
      namespace: cw_made_tool
      id: pickaxe_level_<属性.镐力> #-4木镐

    PublicBukkitValues:
      itemsoulbind:soulbinduuid: <cw_common.绑定.绑定uuid>
cw_p0_1:
  inherit: cw_tool_tem
  sections:
    #基础
    物品名称: "镐铜"
    物品贴图: 10006
    物品材质: "iron_pickaxe"
    物品简介: "这是一把稿子13123"
    绑定_enable: false #默认关闭{"绑定.enable":"true"}
    #属性
    属性:
      镐力: <fastcalc::<基础属性.镐力>/10-10>
    基础属性:
      镐力: 80 # 60=木镐 110开始
      大小: 3
      耐久: 190

