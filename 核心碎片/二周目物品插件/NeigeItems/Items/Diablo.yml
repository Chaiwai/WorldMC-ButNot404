Diablo:
  material: <材质>
  name: "<品质信息.文本颜色><品质> &7&k| <品质信息.文本颜色><前缀><后缀><名称><Diablo.前缀信息.<Diablo.前缀.0>.属性>  <Diablo.前缀信息.炫目的.属性>"
  lore:
    - "&f◇装备信息"
    - "&7装备部位： &f<部位>"
    - "&7使用等级： &f<等级>"
    - "&7装备耐久： &f<耐久>"
    - "&7出售价格： &f<价格>"
    - " "
    - "&f◇基本属性"
    - "<基本属性>"
    - " "
    - "&f◇前缀属性"
    - "<前缀文本>"
    - " "
    - "&f◇后缀属性"
    - "<后缀文本>"
    - " "
    - "&f◇宝石属性"
    - "<宝石槽>"
  options:
    # 设置掉落物发光颜色
    color: <品质信息.掉落颜色>
    # 隐藏物品属性信息(盔甲值、盔甲韧性、攻击伤害等)
    update:
      enable: true
      refresh:
        - material
        - lore
      protect-components:
        - minecraft:custom_name
  hideflags:
    - HIDE_ATTRIBUTES
  # 导入相关全局节点
  globalsections:
    - Diablo.yml
  sections:
    # 1/8概率: 长剑
    # 1/8概率: 斧子
    # 1/8概率: 短弓
    # 1/8概率: 头盔
    # 1/8概率: 胸甲
    # 1/8概率: 护腿
    # 1/8概率: 靴子
    # 1/24概率: 项链
    # 1/24概率: 戒指
    # 1/24概率: 护符
    # 具体实现查看plugins/NeigeItems/GlobalSections/Diablo.yml
    类型: <Diablo.类型>
    # 长剑:
    #   7/28概率: 木剑
    #   8/28概率: 石剑
    #   6/28概率: 金剑
    #   5/28概率: 铁剑
    #   2/28概率: 钻石剑
    # 其余大部分类型装备皆类似于长剑, 进行材质随机
    # 短弓材质固定为弓
    # 项链材质固定为末影之眼
    # 戒指材质固定为末影珍珠
    # 护符材质固定为下界之星
    # 具体实现查看plugins/NeigeItems/GlobalSections/Diablo.yml
    材质: <Diablo.类型信息.<类型>.材质>
    # 长剑: 主手
    # 斧子: 主手
    # 短弓: 主手
    # 头盔: 头部
    # 胸甲: 上装
    # 护腿: 下装
    # 靴子: 靴子
    # 项链: 饰品
    # 戒指: 饰品
    # 护符: 饰品
    # 具体实现查看plugins/NeigeItems/GlobalSections/Diablo.yml
    部位: <Diablo.类型信息.<类型>.部位>
    # 长剑:
    #   木剑: 海盗剑
    #   石剑: 符文剑
    #   金剑: 君王剑
    #   铁剑: 骑士剑
    #   钻石剑: 海啸之刃
    # 其余大部分类型装备皆类似于长剑, 名称与材质相对应
    # 短弓、项链、戒指、护符材质固定
    # 故而进行名称随机
    # 具体实现查看plugins/NeigeItems/GlobalSections/Diablo.yml
    名称: <Diablo.类型信息.<类型>.名称.<材质>>
    # 以玩家等级为基础, 以正态分布, 上浮或下压0-5级
    # 68.27%介于上下浮动1级
    # 27.18%介于上下浮动2级
    # 4.29%介于上下浮动3级
    # 0.26%介于上下浮动4-5级
    # 具体实现查看plugins/NeigeItems/GlobalSections/Diablo.yml
    等级: <Diablo.等级.结果>
    # 数值为 装备等级*100
    # 下限为100
    # 上限为2000
    # 具体实现查看plugins/NeigeItems/GlobalSections/Diablo.yml
    耐久: <Diablo.等级信息.耐久.文本>
    # 以装备等级*100为基础, 以正态分布, 上浮或下压30%
    # 68.27%介于上下浮动10%
    # 27.18%介于上下浮动20%
    # 4.29%介于上下浮动30%
    # 数值下限为50
    # 具体实现查看plugins/NeigeItems/GlobalSections/Diablo.yml
    价格: <Diablo.等级信息.价格>
    # 武器1-5个红宝石
    # 装备1-5个绿宝石
    # 饰品1-3个绿宝石
    # 具体实现查看plugins/NeigeItems/GlobalSections/Diablo.yml
    宝石槽: <Diablo.宝石槽>
    # 7/22概率: 普通
    # 8/22概率: 魔法
    # 5/22概率: 稀有
    # 2/22概率: 传说
    # 具体实现查看plugins/NeigeItems/GlobalSections/Diablo.yml
    品质: <Diablo.品质>
    品质信息:
      # 普通: 白色
      # 魔法: 海蓝色
      # 稀有: 黄色
      # 传说: 金色
      # 具体实现查看plugins/NeigeItems/GlobalSections/Diablo.yml
      文本颜色: <Diablo.品质信息.<品质>.文本颜色>
      # 普通: 白色
      # 魔法: 海蓝色
      # 稀有: 黄色
      # 传说: 金色
      # 具体实现查看plugins/NeigeItems/GlobalSections/Diablo.yml
      掉落颜色: <Diablo.品质信息.<品质>.掉落颜色>
    # 长剑、斧子、短弓: 物理攻击
    #   数值以玩家等级*5为基础, 以正态分布, 上浮或下压30%
    # 头盔、胸甲、护腿、靴子: 物理防御
    #   数值以玩家等级*3为基础, 以正态分布, 上浮或下压30%
    # 项链、戒指、护符: 生命上限
    #   数值以玩家等级*3为基础, 以正态分布, 上浮或下压30%
    # 具体实现查看plugins/NeigeItems/GlobalSections/Diablo.yml
    基本属性: <Diablo.类型信息.<Diablo.类型>.基本属性.文本>
    # 物品前缀, 随机选取
    # 强壮的 (对应属性力量)
    # 野性的 (对应属性敏捷)
    # 神奇的 (对应属性智力)
    # 凯旋的 (对应属性精神)
    # 刚毅的 (对应属性体质)
    # 不灭的 (对应属性生命恢复)
    # 贪婪的 (对应属性生命偷取)
    # 心灵的 (对应属性魔法上限)
    # 结界的 (对应属性元素抵抗)
    # 尖牙的 (对应属性暴击几率)
    # 创伤的 (对应属性暴击伤害)
    # 涌现的 (对应属性魔法回复)
    # 寒冷的 (对应属性冰冻几率)
    # 炫目的 (对应属性致盲几率)
    # 数值基于玩家等级计算, 以正态分布进行上下浮动
    # 具体实现查看plugins/NeigeItems/GlobalSections/Diablo.yml
    前缀: <Diablo.前缀>
    # 物品后缀, 随机选取
    # 星光之 (对应属性魔法伤害)
    # 毒蛇之 (对应属性毒素几率)
    # 焚烧之 (对应属性火焰几率)
    # 电鳗之 (对应属性闪电几率)
    # 苦痛之 (对应属性撕裂几率)
    # 壁垒之 (对应属性物理防御)
    # 荆棘之 (对应属性反弹几率)
    # 拦截之 (对应属性格挡几率)
    # 戏耍之 (对应属性闪避几率)
    # 数值基于玩家等级计算, 以正态分布进行上下浮动
    # 具体实现查看plugins/NeigeItems/GlobalSections/Diablo.yml
    后缀: <Diablo.后缀>
    # 根据当前前缀及品质生成对应属性文本
    # 魔法品质额外生成1条文本
    # 稀有品质额外生成2条文本
    # 传说品质额外生成3条文本
    # 具体实现查看plugins/NeigeItems/GlobalSections/Diablo.yml
    前缀文本: <Diablo.前缀文本>
    # 根据当前后缀及品质生成对应属性文本
    # 魔法品质额外生成1条文本
    # 稀有品质额外生成2条文本
    # 传说品质额外生成3条文本
    # 具体实现查看plugins/NeigeItems/GlobalSections/Diablo.yml
    后缀文本: <Diablo.后缀文本>
