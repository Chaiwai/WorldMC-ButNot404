cw_s_钯金剑:
  right:
    cooldown: 2000
    consume:
      amount: 0
      condition: |-
        (function() {
          var worldTime = player.getWorld().getTime();
          var biome = player.getLocation().getBlock().getBiome().name();

          if (worldTime >= 4000 && worldTime <= 8000) {
            var messages = [
              ":fuhao2: §a现在是" + worldTime + "tick?&e可以可以",
              ":fuhao2: §a干旱地形§e我厌恶水!",
              ":fuhao2: §ayes",
            ];
            var randomIndex = Math.floor(Math.random() * messages.length);
            player.sendMessage(messages[randomIndex]);
            return true;
          }
          if (biome.indexOf("DESERT") !== -1 ||
              biome.indexOf("BADLANDS") !== -1 ||
              biome.indexOf("MESA") !== -1) {
            var messages = [
              ":fuhao2: §a这里是? §b" + biome + " ! §e可以可以",
              ":fuhao2: §a干旱地形§e我喜爱!",
              ":fuhao2: §ayes",
            ];
            var randomIndex = Math.floor(Math.random() * messages.length);
            player.sendMessage(messages[randomIndex]);
            return true;
          }

          var messages = [
            ":fuhao1: §c[ 6000tick§7, §e8000tick ]",
            ":fuhao1: §c干旱地形§e我厌恶水!",
            ":fuhao1: §c现在是" + worldTime + "§etick",
            ":fuhao2: §an§eo",
          ];
          var randomIndex = Math.floor(Math.random() * messages.length);
          player.sendMessage(messages[randomIndex]);
          return false;

        })()
    actions:
      - "give-health: 1"
      - "set-potion-effect: Strength 1 120"
      - "set-potion-effect: night_vision 1 120"
      - "takeDamage: 100"
      - "sound: entity.elder_guardian.curse 10 0.4"

