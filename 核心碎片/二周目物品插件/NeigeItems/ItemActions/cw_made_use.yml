cwMade_box_false:
  right:
    cooldown: 250
    consume:
      condition: 'papi("%vault_eco_balance%") >= 1000'
      amount: 1
      deny:
        - "tell: &f:fuhao1:&c条件不满足!&7你需要有<nbt::need>&f%img_money%"
        - "console: sound entity_item_break %player_name%"
    actions:
      - "takeMoney: <nbt::money>"
      - "console: ni give %player_name% cwMade_box_true 1"
      - "tell: "
      - "tell: &f:fuhao3:&a破译成功!&7(本次消耗&c<nbt::money>&f%img_money%)"
      - "console: sound entity_player_levelup %player_name%"
  drop:
    actions:
      - "tell: &f:fuhao2: &7珍贵道具,确定要丢弃吗?(Ctrl+Q快速丢弃)"

cwMade_box_true:
  right:
    cooldown: 250
    consume:
      amount: 1
    actions:
      - "console: ni givePack %player_name% cw_random"
      - "tell: &f:fuhao3:&a开启成功!"
  shift_right:
    cooldown: 250
    consume:
      amount: 10
    actions:
      - "console: ni givePack %player_name% cw_random 10"
      - "tell: &f:fuhao3:&a开启成功!"
  drop:
    actions:
      - "tell: &f:fuhao2: &7珍贵道具,确定要丢弃吗?(Ctrl+Q快速丢弃)"
cwMade_cd:
  right:
    cooldown: 250
    consume:
    actions:
      - "player: cd"

cwMade_kill:
  pick:
    cooldown: 0
    sync:
      - "console: ply give %player_name% kill <fastcalc::<data::虚拟道具数量>*<amount::>> &b拾取"
      - "console: actionbarmsg %player_name% &e拾取了 &a<fastcalc::<data::虚拟道具数量>*<amount::>> &e杀戮点"
      - "sound: entity.player.hurt_drown 1 2"
      # 移除物品
      - "js: event.item.remove();event.setCancelled(true)"

cw_test0:
  drop:
    cooldown: 1500
    consume:
      amount: 1
    actions:
      - "castSkill: cw_skill0"
      - "console: ni give %player_name% cw_test0"
