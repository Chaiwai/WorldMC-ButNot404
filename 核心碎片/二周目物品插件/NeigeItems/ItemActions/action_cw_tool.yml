cw_p_110_end:
  shift_right:
    cooldown: 1000
    consume:
      cooldown: 1000
      amount: 0
    actions: "console: damage %player_name% 0.0625"

  damaged_hand:
    cooldown: 90000
    consume:
      cooldown: 90000
      amount: 0
      condition: |-
        (function() {
          var damage = event.getFinalDamage();
          global.fdamaged = damage > 100 ? 0 : damage;
          return true;
        })()
    actions:
      - "give-health: <fastcalc::<fdamaged>>"
      - "set-potion-effect: Invisibility 1 5"
      - "set-potion-effect: speed 2 5"
      - "sound: entity.enderman.hurt 1 1.5"
      - "actionbar: <#FF99FF>触发末影闪避, 暂缓<#FFFF99> <fdamaged> <#FF99FF>点伤害"
      - "delay: 100"
      - "actionbar: <#FF99FF>末影闪避结束, 消耗<#FFFF99> <fastcalc::<fdamaged>> <#FF99FF>点耐久"
      - "sound: entity.enderman.death 1 0.5"
      - "addDamage: <fastcalc::<fdamaged>>"
      - "take-health: <fastcalc::<fdamaged>>"

